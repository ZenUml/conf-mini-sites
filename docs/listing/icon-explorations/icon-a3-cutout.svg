<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Mini Sites — cutout">
  <!-- Direction A (bold geometric) · 03 "Cutout"
       Two colours and a hole: the window is PUNCHED OUT of the navy page, so the amber
       ground shines through it — "the page opens onto something live". The most reduced
       of the set: reads at any size because it is only two shapes and negative space. -->
  <defs>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="#FFB020"/>
    <!-- Navy page with the window cut out (evenodd) -->
    <path fill="#15233E" fill-rule="evenodd" d="
      M 132 76 h 248 a 28 28 0 0 1 28 28 v 304 a 28 28 0 0 1 -28 28 h -248 a 28 28 0 0 1 -28 -28 v -304 a 28 28 0 0 1 28 -28 Z
      M 172 168 h 168 a 20 20 0 0 1 20 20 v 176 a 20 20 0 0 1 -20 20 h -168 a 20 20 0 0 1 -20 -20 v -176 a 20 20 0 0 1 20 -20 Z
    "/>
    <!-- Page heading, white on navy -->
    <rect x="152" y="112" width="140" height="18" rx="9" fill="#FFFFFF" opacity="0.7"/>
    <!-- Inside the punched window: white content on amber -->
    <rect x="180" y="204" width="128" height="20" rx="10" fill="#FFFFFF"/>
    <rect x="180" y="240" width="92" height="14" rx="7" fill="#FFFFFF" opacity="0.65"/>
    <rect x="180" y="268" width="112" height="14" rx="7" fill="#FFFFFF" opacity="0.65"/>
    <circle cx="194" cy="320" r="14" fill="#15233E"/>
  </g>
</svg>
