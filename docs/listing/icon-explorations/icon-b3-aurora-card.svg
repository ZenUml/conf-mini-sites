<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Mini Sites — aurora card">
  <!-- Direction B (vibrant gradient) · 03 "Aurora Card"
       Violet→pink ground with a cyan-family window: the two gradients are complementary,
       so the window pops as "a different, live thing" sitting inside the calm white page. -->
  <defs>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
    <linearGradient id="ground-b3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="win-b3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#ground-b3)"/>
    <!-- The Confluence page -->
    <rect x="100" y="72" width="312" height="368" rx="28" fill="#FFFFFF"/>
    <!-- Page heading -->
    <rect x="148" y="108" width="132" height="18" rx="9" fill="#C7CDDF"/>
    <!-- The embedded mini-site window -->
    <rect x="148" y="156" width="216" height="228" rx="24" fill="url(#win-b3)"/>
    <!-- Browser dots -->
    <circle cx="184" cy="192" r="10" fill="#FFFFFF"/>
    <circle cx="214" cy="192" r="10" fill="#FFFFFF" opacity="0.55"/>
    <circle cx="244" cy="192" r="10" fill="#FFFFFF" opacity="0.55"/>
    <!-- Live site content -->
    <rect x="176" y="228" width="140" height="20" rx="10" fill="#FFFFFF"/>
    <rect x="176" y="264" width="104" height="14" rx="7" fill="#FFFFFF" opacity="0.6"/>
    <rect x="176" y="292" width="124" height="14" rx="7" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="190" cy="342" r="14" fill="#FFFFFF"/>
  </g>
</svg>
