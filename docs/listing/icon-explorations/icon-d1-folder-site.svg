<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Mini Sites — folder site">
  <!-- D1 "Folder Site" — the folder IS the site. A plain folder silhouette wearing browser dots:
       first glance folder ("drop the whole folder in"), second glance browser ("it becomes a site").
       One path + three dots. -->
  <defs>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="#FFB020"/>
    <path fill="#15233E" d="M 124 110 h 88 q 14 0 22 11 l 22 29 h 128 a 28 28 0 0 1 28 28 v 196 a 28 28 0 0 1 -28 28 H 124 a 28 28 0 0 1 -28 -28 V 138 a 28 28 0 0 1 28 -28 Z"/>
    <circle cx="152" cy="204" r="15" fill="#FFB020"/>
    <circle cx="196" cy="204" r="15" fill="#FFFFFF"/>
    <circle cx="240" cy="204" r="15" fill="#FFFFFF"/>
  </g>
</svg>
