<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Mini Sites — click ripple, parchment outlined">
  <!-- D2c3c — the have-both route: arcs at FULL brand amber (#FFB020) with an ink rim under
       them (same path, +14 stroke). The rim does the contrast work, the amber does the singing;
       matches the ink cursor, so the whole motif reads as one printed illustration. -->
  <defs>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="#F4ECDD"/>
    <path fill="none" stroke="#15233E" stroke-width="42" stroke-linecap="round" d="M 241 143 A 80 80 0 0 0 140 227"/>
    <path fill="none" stroke="#15233E" stroke-width="44" stroke-linecap="round" d="M 268 88 A 140 140 0 0 0 93 279"/>
    <path fill="none" stroke="#FFB020" stroke-width="28" stroke-linecap="round" d="M 241 143 A 80 80 0 0 0 140 227"/>
    <path fill="none" stroke="#FFB020" stroke-width="30" stroke-linecap="round" d="M 268 88 A 140 140 0 0 0 93 279"/>
    <path fill="#15233E" d="M 220 220 l 89 214 l 32 -94 l 94 -32 Z"/>
  </g>
</svg>
