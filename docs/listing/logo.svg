<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Mini Site for Confluence">
  <!-- Mini Site for Confluence — Marketplace logo.
       "Click Spark" (F3, user-picked 2026-07-22): parchment ground, three bright-amber spark
       ticks, ink cursor. The mark is the instant of the click — the name carries "Site", the
       icon carries "it's alive". Straight ticks, not arcs: the arc grammar collided with RSS
       (dot + nested arcs, orange) — see icon-explorations/icon-f0-rss-reference.svg for the
       confusion test that killed the ripple version. Palette stays on the amber(38.7deg)/
       ink(219.5deg) complementary axis. Export to PNG at 144x144 (and 512x512). -->
  <defs>
    <clipPath id="r"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="512" height="512" fill="#F4ECDD"/>
    <path fill="none" stroke="#D18A18" stroke-width="28" stroke-linecap="round" d="M 208 151 L 197 92"/>
    <path fill="none" stroke="#D18A18" stroke-width="28" stroke-linecap="round" d="M 166 175 L 113 130"/>
    <path fill="none" stroke="#D18A18" stroke-width="28" stroke-linecap="round" d="M 150 220 L 90 220"/>
    <path fill="#15233E" d="M 220 220 l 89 214 l 32 -94 l 94 -32 Z"/>
  </g>
</svg>
