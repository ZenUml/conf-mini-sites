<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Mini Site for Confluence">
  <!-- Mini Site for Confluence — Marketplace logo.
       "Chrome Amber": the tile IS a browser — amber canvas, ink title bar, three dots.
       Chosen 2026-07-22 over the nested window-in-page mark: at 16px (macro quick-insert menu)
       nesting mushed; a bare browser survives every size. Explorations kept in
       docs/listing/icon-explorations/. Export to PNG at 144x144 (and 512x512) for the listing. -->
  <defs>
    <clipPath id="r"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="512" height="512" fill="#FFB020"/>
    <rect width="512" height="148" fill="#15233E"/>
    <circle cx="92" cy="74" r="22" fill="#FFB020"/>
    <circle cx="156" cy="74" r="22" fill="#FFFFFF"/>
    <circle cx="220" cy="74" r="22" fill="#FFFFFF"/>
  </g>
</svg>
