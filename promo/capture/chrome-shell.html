<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chrome shell</title>
<!--
  A browser window drawn in HTML, wrapping the REAL prototype in an iframe.

  Why this exists: Playwright records the page viewport only — never the browser's own chrome. The promo
  script opens on an address bar reading `localhost:3000` and later pushes in on it ("it only exists on
  my machine"), so the chrome has to be inside the frame we record.

  This is a frame around a real page, not a mock of the page: the iframe below loads the actual site off
  the actual local server on port 3000, so what the address bar claims is literally true.
-->
<style>
  :root{
    --chrome-bg:#dee1e6; --chrome-top:#dee1e6; --toolbar:#ffffff; --tab:#ffffff;
    --omni:#f1f3f4; --ink:#3c4043; --ink-dim:#5f6368; --line:#c8ccd0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#202124}
  body{font:400 13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink)}
  .win{height:100vh;display:flex;flex-direction:column;background:var(--chrome-bg)}

  /* ── tab strip ─────────────────────────────────────────────── */
  .tabs{height:40px;display:flex;align-items:flex-end;gap:0;padding:0 8px;background:var(--chrome-top);flex:none}
  .lights{display:flex;align-items:center;gap:8px;padding:0 14px 10px 6px}
  .light{width:12px;height:12px;border-radius:50%}
  .l1{background:#ff5f57}.l2{background:#febc2e}.l3{background:#28c840}
  .tab{height:34px;min-width:240px;max-width:280px;display:flex;align-items:center;gap:9px;
       padding:0 12px;background:var(--tab);border-radius:9px 9px 0 0;font-size:12.5px;color:var(--ink)}
  .favicon{width:16px;height:16px;border-radius:4px;background:linear-gradient(135deg,#7c3aed,#4c1d95);flex:none}
  .tab-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  .tab-x{color:var(--ink-dim);font-size:15px;line-height:1;opacity:.75}
  .newtab{margin:0 0 6px 8px;color:var(--ink-dim);font-size:17px;line-height:1;opacity:.8}

  /* ── toolbar ───────────────────────────────────────────────── */
  .toolbar{height:48px;display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--toolbar);flex:none}
  .nav{display:flex;align-items:center;gap:16px;color:var(--ink-dim)}
  .nav svg{display:block}
  .nav .off{opacity:.35}
  .omni{flex:1;height:32px;display:flex;align-items:center;gap:10px;padding:0 14px;
        background:var(--omni);border-radius:16px;color:var(--ink);font-size:13.5px}
  .omni .host{color:var(--ink)}
  .omni .path{color:var(--ink-dim)}
  .right{display:flex;align-items:center;gap:14px;color:var(--ink-dim)}
  .avatar{width:24px;height:24px;border-radius:50%;background:#c8ccd0}

  /* ── content ───────────────────────────────────────────────── */
  .viewport{flex:1;background:#fff;border-top:1px solid var(--line)}
  iframe{width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
<div class="win">
  <div class="tabs">
    <div class="lights"><span class="light l1"></span><span class="light l2"></span><span class="light l3"></span></div>
    <div class="tab"><span class="favicon"></span><span class="tab-title">Feature Prioritisation</span><span class="tab-x">×</span></div>
    <div class="newtab">+</div>
  </div>

  <div class="toolbar">
    <div class="nav">
      <svg class="off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      <svg class="off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
    </div>

    <div class="omni" id="omnibox">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity:.7"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
      <span><span class="host">localhost:3000</span></span>
    </div>

    <div class="right">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17.3 5.8 21l1.2-6.9L2 9.2l7-1L12 2l3 6.2 7 1-5 4.9 1.2 6.9z"/></svg>
      <div class="avatar"></div>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg>
    </div>
  </div>

  <div class="viewport"><iframe id="site" src="http://localhost:3000/" title="Feature Prioritisation"></iframe></div>
</div>
</body>
</html>
